name: Android CI - Build Debug APK

on:
  push:
    branches: [ adblock-js-injection ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew (if present)
        run: |
          if [ -f ./gradlew ]; then chmod +x ./gradlew; fi

      - name: Install Gradle (SDKMAN)
        env:
          GRADLE_VERSION: 8.4.1
        run: |
          set -euo pipefail
          echo "Installing Gradle ${GRADLE_VERSION} via SDKMAN..."
          curl -s "https://get.sdkman.io" | bash
          # shellcheck disable=SC1091
          source "$HOME/.sdkman/bin/sdkman-init.sh"
          sdk install gradle ${GRADLE_VERSION}
          echo "$HOME/.sdkman/candidates/gradle/${GRADLE_VERSION}/bin" >> $GITHUB_PATH

      - name: Verify gradle
        run: gradle --version

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
