name: Android CI - Build Debug APK

on:
  push:
    branches: [ adblock-js-injection ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew (if present)
        run: |
          if [ -f ./gradlew ]; then chmod +x ./gradlew; fi

      - name: Ensure unzip and curl
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip curl

      - name: Use Gradle wrapper if present, otherwise download Gradle
        env:
          GRADLE_VERSION: 8.4.1
        run: |
          set -euo pipefail
          if [ -f ./gradlew ]; then
            echo "Found gradlew; using project Gradle wrapper"
            ./gradlew --version
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            echo "No gradlew found; downloading Gradle ${GRADLE_VERSION} distribution"
            curl -L -o gradle.zip https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip
            unzip -q gradle.zip -d /opt/gradle
            export PATH=/opt/gradle/gradle-${GRADLE_VERSION}/bin:$PATH
            gradle --version
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
