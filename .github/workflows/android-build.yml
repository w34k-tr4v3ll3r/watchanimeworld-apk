name: Android CI - Build Debug APK

on:
  push:
    branches: [ adblock-js-injection ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew (if present)
        run: |
          if [ -f ./gradlew ]; then chmod +x ./gradlew; fi

      - name: Ensure unzip and curl
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip curl

      - name: Use Gradle wrapper if present, otherwise download Gradle
        env:
          GRADLE_VERSION: 8.4.1
        run: |
          set -euo pipefail

          chmod +x ./gradlew || true

          # Use wrapper if it exists and its JAR validates
          if [ -x ./gradlew ] && [ -f ./gradle/wrapper/gradle-wrapper.jar ] && unzip -t ./gradle/wrapper/gradle-wrapper.jar >/dev/null 2>&1; then
            echo "Found valid gradlew; using project Gradle wrapper"
            ./gradlew --version
            ./gradlew assembleDebug --no-daemon --stacktrace
            exit 0
          fi

          echo "Gradle wrapper missing/invalid — attempting download fallback"

          # Try download
          if curl -fL -o gradle.zip "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"; then
            if unzip -q gradle.zip -d /opt/gradle; then
              export PATH="/opt/gradle/gradle-${GRADLE_VERSION}/bin:$PATH"
              rm -f gradle.zip
              gradle --version
              gradle assembleDebug --no-daemon --stacktrace
              exit 0
            else
              echo "Downloaded Gradle zip is invalid or unzip failed"
              rm -f gradle.zip
            fi
          else
            echo "Gradle download failed"
          fi

          echo "Attempting apt fallback (may install older Gradle)."
          sudo apt-get update -qq || true
          if sudo apt-get install -y gradle; then
            gradle --version
            gradle assembleDebug --no-daemon --stacktrace
            exit 0
          fi

          echo "All Gradle bootstrap methods failed. Please ensure network access or commit a valid Gradle wrapper."
          exit 2

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
