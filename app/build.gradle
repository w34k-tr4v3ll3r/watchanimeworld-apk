 *
 * To enable the real AdGuard SDK, replace the placeholders below with the real
 * repository and dependency coordinates from AdGuard and add your SDK key.
 * Example (pseudo):
 * repositories {
 *     maven { url 'https://repo.adguard.com/maven' }
 * }
 *
 * dependencies {
 *     implementation 'com.adguard:adguard-sdk:VERSION'
 * }
 *
 * See AdGuard SDK documentation for exact coordinates and initialization steps.
 */

plugins {
    id 'com.android.application'
}

android {
    namespace 'com.watchanimeworld.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.watchanimeworld.app"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildFeatures {
        aidl false
        renderScript false
        resValues false
        shaders false
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

repositories {
    // If you add AdGuard SDK, add their maven repo here per AdGuard instructions
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.google.android.material:material:1.9.0'

    // AdGuard SDK placeholder:
    // implementation 'com.adguard:adguard-sdk:<version>'
}
